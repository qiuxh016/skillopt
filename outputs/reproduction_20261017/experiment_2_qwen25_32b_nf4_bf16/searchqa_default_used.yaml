_base_: ../_base_/default.yaml

model:
  # reasoning_effort: medium
  backend: transformers_local
  optimizer_backend: transformers_local
  target_backend: transformers_local
  optimizer: /root/autodl-tmp/skillOPT/Qwen2.5-32B-Instruct
  target: /root/autodl-tmp/skillOPT/Qwen2.5-7B-Instruct

  # Direct Hugging Face loading; checkpoints already exist on local disk.
  transformers_local_dtype: bfloat16
  transformers_local_quantization: none
  transformers_local_4bit_quant_type: nf4
  transformers_local_4bit_use_double_quant: true
  # Keep target at BF16 and quantize only the 32B optimizer to 4-bit NF4.
  optimizer_transformers_local_quantization: 4bit
  target_transformers_local_quantization: none
  transformers_local_temperature: 1.0
  transformers_local_top_p: 1.0
  transformers_local_top_k: 0
  transformers_local_seed: null
  transformers_local_max_tokens: 8192
  transformers_local_require_cuda: true

train:
  train_size: 400
  batch_size: 40
  accumulation: 1

gradient:
  minibatch_size: 8
  merge_batch_size: 8

optimizer:
  learning_rate: 4

evaluation:
  sel_env_num: 0
  test_env_num: 0

env:
  name: searchqa
  skill_init: skillopt/envs/searchqa/skills/initial.md
  split_mode: split_dir
  split_dir: data/searchqa_split
  data_path: ""
  split_output_dir: ""
  max_turns: 1
  max_completion_tokens: 16384
  workers: 24
  limit: 0
